name: Rebase staging-launch onto sunnypilot staging

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-24.04-arm  # prebuilt .so files are aarch64
    permissions:
      contents: write
    steps:
      - uses: astral-sh/setup-uv@v6

      - name: Install sim libraries
        run: sudo apt-get install -y -qq libzmq5 libgomp1

      - name: Rebase onto latest upstream staging
        id: rebase
        env:
          TOKEN: ${{ secrets.SYNC_PAT || github.token }}
        run: |
          set -euo pipefail
          git init -q repo && cd repo
          git config user.name "fork-sync"
          git config user.email "fork-sync@users.noreply.github.com"
          git remote add upstream https://github.com/sunnypilot/sunnypilot.git
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 upstream staging
          git fetch -q --depth=50 origin staging-launch
          UPSTREAM=$(git rev-parse upstream/staging)
          BASE=$(git log -1 --format=%H --grep="^sunnypilot v" origin/staging-launch)
          if [ "$UPSTREAM" = "$BASE" ]; then
            echo "Already on latest staging ($UPSTREAM); testing current branch"
            git checkout -q origin/staging-launch
            echo "push=false" >> "$GITHUB_OUTPUT"
          else
            git checkout -q "$UPSTREAM"
            git cherry-pick "$BASE..origin/staging-launch"
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi
          git worktree add -q ../stock "$UPSTREAM"
          echo "upstream=$UPSTREAM" >> "$GITHUB_OUTPUT"

      - name: Run launch-fix tests
        run: repo/jvenberg/tests/run.sh

      - name: Run launch sim against stock staging
        run: repo/jvenberg/sim/run.sh stock

      - name: Push
        if: steps.rebase.outputs.push == 'true'
        run: |
          cd repo
          git push -f origin HEAD:staging-launch
          echo "Rebased staging-launch onto ${{ steps.rebase.outputs.upstream }}"
